<!doctype html>
<html lang="it">
<body style="margin:0;padding:0;background:#faf9f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#3d3929;">
  <div style="max-width:620px;margin:0 auto;padding:32px 22px;">
    <div style="width:14px;height:7px;border-radius:14px 14px 0 0;background:#1f7a6b;margin-bottom:12px;"></div>
    <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:26px;line-height:1.25;margin:0 0 6px;color:#141413;">AI News del {{ today }}</h1>
    <p style="margin:0 0 28px;color:#83827d;font-size:14px;">{{ total }} articoli nuovi</p>

    {% for topic, items in by_topic.items() %}
    <h2 style="font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:18px;margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid #e5e3d8;color:#141413;">{{ topic }}</h2>
    {% for a in items %}
    <div style="background:#ffffff;border:1px solid #e5e3d8;border-radius:12px;padding:14px 16px;margin-bottom:10px;">
      <a href="{{ a.url }}" style="font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.35;color:#141413;text-decoration:none;font-weight:500;">{{ a.title }}</a>
      <p style="margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3929;">{{ a.summary }}</p>
    </div>
    {% endfor %}
    {% endfor %}

    <p style="margin:36px 0 0;">
      <a href="{{ base_url }}" style="display:inline-block;background:#1f7a6b;color:#ffffff;text-decoration:none;font-size:14px;font-weight:500;padding:10px 18px;border-radius:999px;">Apri l'archivio e fai domande</a>
    </p>
  </div>
</body>
</html>
