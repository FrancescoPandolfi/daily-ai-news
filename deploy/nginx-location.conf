# Da inserire nel blocco `server { listen 443 ssl; ... }` del sito, al posto del
# `location /` che serve la pagina di default di nginx.
#
#   sudo nano /etc/nginx/sites-available/<tuo-sito>     (o /etc/nginx/conf.d/<tuo-sito>.conf)
#   sudo nginx -t && sudo systemctl reload nginx

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # le risposte RAG e l'avvio della raccolta possono richiedere qualche secondo
    proxy_read_timeout 120s;

    # Le risposte arrivano a pezzi (streaming): l'app manda `X-Accel-Buffering: no` e nginx
    # le inoltra subito. Se mai comparissero tutte insieme alla fine, aggiungi qui `proxy_buffering off;`.
}
